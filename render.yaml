# Render Blueprint for Oficina Pro staging with managed PostgreSQL.
# Secrets marked with sync: false must be filled in the Render dashboard.

databases:
  - name: oficina-pro-staging-db
    plan: basic-256mb
    region: oregon
    databaseName: oficina_pro_staging
    user: oficina_pro
    diskSizeGB: 15

services:
  - type: web
    name: oficina-pro-staging
    runtime: docker
    plan: starter
    region: oregon
    branch: codex/oficina-pro-v1.1
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: staging
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: oficina-pro-staging-db
          property: connectionString
      - key: SESSION_TTL_SECONDS
        value: 28800
      - key: PASSWORD_HASH_ITERATIONS
        value: 260000
      - key: LOGIN_MAX_ATTEMPTS
        value: 5
      - key: LOGIN_WINDOW_SECONDS
        value: 900
      - key: LOGIN_LOCK_SECONDS
        value: 900
      - key: DEFAULT_ADMIN_NAME
        value: MASTER
      - key: DEFAULT_ADMIN_USERNAME
        value: master
      - key: DEFAULT_ADMIN_EMAIL
        sync: false
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
